kind = "mobile"
previewPath = "/"
title = "ViewState App"
description = "ViewState is a lean bilingual (Arabic/English) real-estate mobile beta. A governance-first project for matching buyers and sellers of properties, with WhatsApp import, contacts integration, and property management. Currently in PRE-IMPLEMENTATION state — no product features have been built yet."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
